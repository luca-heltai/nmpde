version: 1

project:
  title: Numerical Methods for Partial Differential Equations
  authors:
    - name: Luca Heltai
  github: luca-heltai/nmpde
  bibliography:
    - references.bib
  static_files:
    - assets
  toc:
    - file: intro.md
    - file: syllabus.md
    - file: references.md
    - file: lectures/index.md
      children:
        - file: lectures/lecture-01.md
        - file: lectures/lecture-02.md
        - file: lectures/lecture-03.md
        - file: lectures/lecture-04.md
        - file: lectures/lecture-05.md
        - file: lectures/lecture-06.md
        - file: lectures/lecture-07.md
    - file: laboratories/index.md
      children:
        - file: laboratories/lab-01.md
        - file: laboratories/lab-02.md
        - file: laboratories/lab-03.md
        - file: laboratories/lab-04.md
        - file: laboratories/lab-05.md
        - file: laboratories/lab-06.md
    - file: projects.md

site:
  # Pin the theme to the version supported by Jupyter Book 2.1.6.
  template: https://github.com/jupyter-book/myst-theme/releases/download/myst-to-react%401.4.1/book-theme.zip
  options:
    folders: true
    logo: ./figures/logo.png
