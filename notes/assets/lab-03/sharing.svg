<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc"><title id="title">Shared and cell-local degrees of freedom</title><desc id="desc">Two-cell examples. A conforming face DoF has one shared global index; two discontinuous DoFs can be evaluated at the same point while retaining independent global indices.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1060" height="470" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="24" fill="#172b4d" text-anchor="start">Association with a mesh object is a logical choice</text><text x="50" y="83" font-size="22" fill="#172b4d" text-anchor="start">Conforming Lagrange</text><rect x="50" y="125" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><rect x="230" y="125" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><line x1="230" y1="125" x2="230" y2="305" stroke="#7c3aed" stroke-width="5"/><circle cx="230" cy="215" r="10" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="230" y="350" font-size="17" fill="#172b4d" text-anchor="middle">same face functional → same global DoF</text><text x="580" y="83" font-size="22" fill="#172b4d" text-anchor="start">Discontinuous Lagrange</text><rect x="580" y="125" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><rect x="760" y="125" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><circle cx="749" cy="215" r="10" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="771" cy="215" r="10" fill="#126782" stroke="white" stroke-width="2"/><text x="712" y="200" font-size="22" fill="#172b4d" text-anchor="start">I</text><text x="790" y="200" font-size="22" fill="#172b4d" text-anchor="start">J</text><text x="760" y="350" font-size="17" fill="#172b4d" text-anchor="middle">cell-local functionals → independent DoFs</text><text x="30" y="405" font-size="18" fill="#172b4d" text-anchor="start">DG markers are offset only for readability: two support points can have identical coordinates.</text><text x="30" y="438" font-size="18" fill="#172b4d" text-anchor="start">Their attachment is to separate cells; comparing point coordinates does not identify the DoFs.</text></g></svg>
