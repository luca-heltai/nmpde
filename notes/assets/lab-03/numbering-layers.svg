<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 455" role="img" aria-labelledby="title desc"><title id="title">Mesh, local basis and global DoF indices</title><desc id="desc">Two 1D Q2 cells. Mesh vertices are 0,1,2. Local bases use endpoint indices 0,1 and midpoint index 2. The five global DoFs are numbered 3,0,4,1,2 from left to right. The central shared DoF has global index 4.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1060" height="455" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="25" fill="#172b4d" text-anchor="start">One mesh, three distinct index systems</text><text x="30" y="105" font-size="19" fill="#172b4d" text-anchor="start">Mesh vertices</text><line x1="230" y1="100" x2="950" y2="100" stroke="#64748b" stroke-width="3"/><circle cx="230" cy="100" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="230" y="83" font-size="19" fill="#172b4d" text-anchor="middle">vertex 0</text><circle cx="590" cy="100" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="590" y="83" font-size="19" fill="#172b4d" text-anchor="middle">vertex 1</text><circle cx="950" cy="100" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="950" y="83" font-size="19" fill="#172b4d" text-anchor="middle">vertex 2</text><text x="410" y="133" font-size="19" fill="#172b4d" text-anchor="middle">cell A</text><text x="770" y="133" font-size="19" fill="#172b4d" text-anchor="middle">cell B</text><text x="30" y="207" font-size="19" fill="#172b4d" text-anchor="start">Local Q2 bases</text><line x1="230" y1="200" x2="565" y2="200" stroke="#64748b" stroke-width="3"/><line x1="615" y1="200" x2="950" y2="200" stroke="#64748b" stroke-width="3"/><circle cx="230" cy="200" r="7" fill="#b45309" stroke="white" stroke-width="2"/><text x="230" y="235" font-size="19" fill="#92400e" text-anchor="middle">i = 0</text><circle cx="397.5" cy="200" r="7" fill="#b45309" stroke="white" stroke-width="2"/><text x="397.5" y="235" font-size="19" fill="#92400e" text-anchor="middle">i = 2</text><circle cx="565" cy="200" r="7" fill="#b45309" stroke="white" stroke-width="2"/><text x="565" y="235" font-size="19" fill="#92400e" text-anchor="middle">i = 1</text><circle cx="615" cy="200" r="7" fill="#b45309" stroke="white" stroke-width="2"/><text x="615" y="235" font-size="19" fill="#92400e" text-anchor="middle">i = 0</text><circle cx="782.5" cy="200" r="7" fill="#b45309" stroke="white" stroke-width="2"/><text x="782.5" y="235" font-size="19" fill="#92400e" text-anchor="middle">i = 2</text><circle cx="950" cy="200" r="7" fill="#b45309" stroke="white" stroke-width="2"/><text x="950" y="235" font-size="19" fill="#92400e" text-anchor="middle">i = 1</text><text x="590" y="177" font-size="16" fill="#172b4d" text-anchor="middle">shared vertex, two local occurrences</text><text x="30" y="310" font-size="19" fill="#172b4d" text-anchor="start">Global DoFs</text><line x1="230" y1="300" x2="950" y2="300" stroke="#64748b" stroke-width="3"/><circle cx="230" cy="300" r="7" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="230" y="335" font-size="19" fill="#6d28d9" text-anchor="middle">I = 3</text><circle cx="410" cy="300" r="7" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="410" y="335" font-size="19" fill="#6d28d9" text-anchor="middle">I = 0</text><circle cx="590" cy="300" r="7" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="590" y="335" font-size="19" fill="#6d28d9" text-anchor="middle">I = 4</text><circle cx="770" cy="300" r="7" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="770" y="335" font-size="19" fill="#6d28d9" text-anchor="middle">I = 1</text><circle cx="950" cy="300" r="7" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="950" y="335" font-size="19" fill="#6d28d9" text-anchor="middle">I = 2</text><text x="230" y="385" font-size="19" fill="#172b4d" text-anchor="start">Cell A: g_A(0, 1, 2) = (3, 4, 0)</text><text x="650" y="385" font-size="19" fill="#172b4d" text-anchor="start">Cell B: g_B(0, 1, 2) = (4, 2, 1)</text><text x="30" y="425" font-size="18" fill="#172b4d" text-anchor="start">Illustrative global numbering: the shared DoF has one global index and two local indices.</text></g></svg>
