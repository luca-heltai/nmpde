<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 450" role="img" aria-labelledby="title desc"><title id="title">Exclusive dpo versus inclusive face and cell counts</title><desc id="desc">Q2 nodes on a square are colored blue at vertices, orange in edge interiors, and purple in the cell interior. A face count includes endpoint DoFs; an exclusive edge count does not.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1060" height="450" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="24" fill="#172b4d" text-anchor="start">Degrees of freedom per object: exclusive and inclusive counts</text><rect x="80" y="90" width="260" height="260" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><circle cx="80" cy="90" r="9" fill="#126782" stroke="white" stroke-width="2"/><circle cx="80" cy="220" r="9" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="80" cy="350" r="9" fill="#126782" stroke="white" stroke-width="2"/><circle cx="210" cy="90" r="9" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="210" cy="220" r="9" fill="#7c3aed" stroke="white" stroke-width="2"/><circle cx="210" cy="350" r="9" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="340" cy="90" r="9" fill="#126782" stroke="white" stroke-width="2"/><circle cx="340" cy="220" r="9" fill="#b45309" stroke="white" stroke-width="2"/><circle cx="340" cy="350" r="9" fill="#126782" stroke="white" stroke-width="2"/><text x="80" y="390" font-size="20" fill="#172b4d" text-anchor="start">A scalar Q2 cell</text><text x="430" y="100" font-size="19" fill="#126782" text-anchor="start">dpo[0]: attached to one vertex</text><text x="430" y="155" font-size="19" fill="#92400e" text-anchor="start">dpo[1]: attached to one edge, excluding endpoints</text><text x="430" y="210" font-size="19" fill="#6d28d9" text-anchor="start">dpo[2]: attached to one cell, excluding its boundary</text><text x="430" y="280" font-size="19" fill="#172b4d" text-anchor="start">DoFs per face include that face’s endpoint DoFs.</text><text x="430" y="320" font-size="19" fill="#172b4d" text-anchor="start">DoFs per cell include all its subobjects.</text><text x="430" y="380" font-size="19" fill="#172b4d" text-anchor="start">2D: edge = face; quadrilateral = cell.</text><text x="430" y="415" font-size="19" fill="#172b4d" text-anchor="start">3D: edge, surface face and volume cell are distinct.</text></g></svg>
