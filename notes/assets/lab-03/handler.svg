<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 445" role="img" aria-labelledby="title desc"><title id="title">Responsibilities of the mesh, element, DoFHandler and coefficient vector</title><desc id="desc">Triangulation and FiniteElement feed DoFHandler. The coefficient vector is a separate object indexed by the resulting global DoFs. Renumbering does not renumber mesh objects.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1060" height="445" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="24" fill="#172b4d" text-anchor="start">The DoFHandler connects topology and a finite element</text><rect x="30" y="85" width="290" height="95" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="175" y="123" font-size="23" fill="#172b4d" text-anchor="middle">Triangulation</text><text x="175" y="156" font-size="17" fill="#172b4d" text-anchor="middle">objects + connectivity + geometry</text><rect x="30" y="220" width="290" height="95" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="175" y="258" font-size="23" fill="#172b4d" text-anchor="middle">FiniteElement</text><text x="175" y="291" font-size="17" fill="#172b4d" text-anchor="middle">local basis + dual basis + dpo</text><line x1="320" y1="130" x2="405" y2="195" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="320" y1="265" x2="405" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="415" y="140" width="250" height="120" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="540" y="183" font-size="24" fill="#172b4d" text-anchor="middle">DoFHandler</text><text x="540" y="217" font-size="18" fill="#172b4d" text-anchor="middle">global DoF numbering</text><text x="540" y="245" font-size="18" fill="#172b4d" text-anchor="middle">local-to-global maps g_K</text><line x1="665" y1="200" x2="735" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="140" width="280" height="120" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="890" y="183" font-size="21" fill="#172b4d" text-anchor="middle">Vector of coefficients</text><text x="890" y="218" font-size="16" fill="#172b4d" text-anchor="middle">values U indexed by global DoF</text><text x="30" y="375" font-size="18" fill="#172b4d" text-anchor="start">Renumbering changes global indices and g_K; mesh-object indices and the space stay fixed.</text><text x="30" y="410" font-size="18" fill="#172b4d" text-anchor="start">To represent the same function, reorder its coefficient vector consistently.</text></g></svg>
