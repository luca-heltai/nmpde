<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 475" role="img" aria-labelledby="title desc"><title id="title">Local subobject indices versus mesh-object indices</title><desc id="desc">Left: reference quad local vertex slots 0 to 3 and face slots 0 to 3. Right: a separate three-cell mesh with global vertex labels V0 to V7 and edge labels E0 to E9. These are topology labels, not DoF labels.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1060" height="475" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" font-size="25" fill="#172b4d" text-anchor="start">Local object numbers and mesh-object numbers</text><text x="30" y="80" font-size="21" fill="#172b4d" text-anchor="start">One reference quadrilateral</text><rect x="65" y="150" width="200" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><circle cx="65" cy="330" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="65" y="358" font-size="17" fill="#172b4d" text-anchor="middle">v = 0</text><circle cx="265" cy="330" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="265" y="358" font-size="17" fill="#172b4d" text-anchor="middle">v = 1</text><circle cx="65" cy="150" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="65" y="134" font-size="17" fill="#172b4d" text-anchor="middle">v = 2</text><circle cx="265" cy="150" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="265" y="134" font-size="17" fill="#172b4d" text-anchor="middle">v = 3</text><text x="34" y="244" font-size="16" fill="#92400e" text-anchor="middle">f = 0</text><text x="302" y="244" font-size="16" fill="#92400e" text-anchor="middle">f = 1</text><text x="165" y="370" font-size="16" fill="#92400e" text-anchor="middle">f = 2</text><text x="165" y="122" font-size="16" fill="#92400e" text-anchor="middle">f = 3</text><text x="440" y="80" font-size="21" fill="#172b4d" text-anchor="start">A separate three-cell mesh: global object labels</text><rect x="455" y="150" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="545" y="245" font-size="19" fill="#172b4d" text-anchor="middle">cell 0</text><rect x="635" y="150" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="725" y="245" font-size="19" fill="#172b4d" text-anchor="middle">cell 1</text><rect x="815" y="150" width="180" height="180" rx="8" fill="#edf6fa" stroke="#64748b" stroke-width="2"/><text x="905" y="245" font-size="19" fill="#172b4d" text-anchor="middle">cell 2</text><circle cx="455" cy="330" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="455" y="358" font-size="17" fill="#172b4d" text-anchor="middle">V0</text><circle cx="635" cy="330" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="635" y="358" font-size="17" fill="#172b4d" text-anchor="middle">V1</text><circle cx="815" cy="330" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="815" y="358" font-size="17" fill="#172b4d" text-anchor="middle">V2</text><circle cx="995" cy="330" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="995" y="358" font-size="17" fill="#172b4d" text-anchor="middle">V3</text><circle cx="455" cy="150" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="455" y="134" font-size="17" fill="#172b4d" text-anchor="middle">V4</text><circle cx="635" cy="150" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="635" y="134" font-size="17" fill="#172b4d" text-anchor="middle">V5</text><circle cx="815" cy="150" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="815" y="134" font-size="17" fill="#172b4d" text-anchor="middle">V6</text><circle cx="995" cy="150" r="7" fill="#126782" stroke="white" stroke-width="2"/><text x="995" y="134" font-size="17" fill="#172b4d" text-anchor="middle">V7</text><text x="545" y="309" font-size="17" fill="#92400e" text-anchor="middle">E0</text><text x="545" y="179" font-size="17" fill="#92400e" text-anchor="middle">E3</text><text x="725" y="309" font-size="17" fill="#92400e" text-anchor="middle">E1</text><text x="725" y="179" font-size="17" fill="#92400e" text-anchor="middle">E4</text><text x="905" y="309" font-size="17" fill="#92400e" text-anchor="middle">E2</text><text x="905" y="179" font-size="17" fill="#92400e" text-anchor="middle">E5</text><text x="469" y="215" font-size="16" fill="#92400e" text-anchor="start">E6</text><text x="649" y="215" font-size="16" fill="#92400e" text-anchor="start">E7</text><text x="829" y="215" font-size="16" fill="#92400e" text-anchor="start">E8</text><text x="1009" y="215" font-size="16" fill="#92400e" text-anchor="start">E9</text><text x="30" y="410" font-size="18" fill="#172b4d" text-anchor="start">Local vertex/face slots restart on each cell. Mesh-object IDs identify shared objects.</text><text x="30" y="443" font-size="18" fill="#172b4d" text-anchor="start">These are illustrative topology labels. No global DoF numbering has been assigned here.</text></g></svg>
