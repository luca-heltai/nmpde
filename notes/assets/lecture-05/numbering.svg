<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">One mesh, three numberings</title><desc id="desc">Two Q2 intervals. Geometric vertices are 0,1,2. Local DoFs use endpoint-first indices 0,1,2. Global DoFs from left to right are 3,0,4,1,2. The shared endpoint has two local occurrences and one global coefficient.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1120" height="510" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="36" font-size="25" fill="#172b4d" text-anchor="start" font-weight="bold">Identify the shared measurement, then enumerate the classes</text><text x="28" y="112" font-size="21" fill="#172b4d" text-anchor="start" font-weight="normal">Mesh objects</text><text x="28" y="240" font-size="21" fill="#172b4d" text-anchor="start" font-weight="normal">Local Q2 DoFs</text><text x="28" y="370" font-size="21" fill="#172b4d" text-anchor="start" font-weight="normal">Global DoFs</text><line x1="270" y1="102" x2="1010" y2="102" stroke="#64748b" stroke-width="3"/><circle cx="270" cy="102" r="8" fill="#126782" stroke="white" stroke-width="2"/><text x="270" y="82" font-size="19" fill="#126782" text-anchor="middle" font-weight="normal">vertex 0</text><circle cx="640" cy="102" r="8" fill="#126782" stroke="white" stroke-width="2"/><text x="640" y="82" font-size="19" fill="#126782" text-anchor="middle" font-weight="normal">vertex 1</text><circle cx="1010" cy="102" r="8" fill="#126782" stroke="white" stroke-width="2"/><text x="1010" y="82" font-size="19" fill="#126782" text-anchor="middle" font-weight="normal">vertex 2</text><text x="455" y="140" font-size="19" fill="#126782" text-anchor="middle" font-weight="normal">cell A</text><text x="825" y="140" font-size="19" fill="#126782" text-anchor="middle" font-weight="normal">cell B</text><line x1="270" y1="230" x2="600" y2="230" stroke="#64748b" stroke-width="3"/><line x1="680" y1="230" x2="1010" y2="230" stroke="#64748b" stroke-width="3"/><circle cx="270" cy="230" r="8" fill="#b45309" stroke="white" stroke-width="2"/><text x="270" y="267" font-size="19" fill="#b45309" text-anchor="middle" font-weight="normal">i = 0</text><circle cx="435" cy="230" r="8" fill="#b45309" stroke="white" stroke-width="2"/><text x="435" y="267" font-size="19" fill="#b45309" text-anchor="middle" font-weight="normal">i = 2</text><circle cx="600" cy="230" r="8" fill="#b45309" stroke="white" stroke-width="2"/><text x="600" y="267" font-size="19" fill="#b45309" text-anchor="middle" font-weight="normal">i = 1</text><circle cx="680" cy="230" r="8" fill="#b45309" stroke="white" stroke-width="2"/><text x="680" y="267" font-size="19" fill="#b45309" text-anchor="middle" font-weight="normal">i = 0</text><circle cx="845" cy="230" r="8" fill="#b45309" stroke="white" stroke-width="2"/><text x="845" y="267" font-size="19" fill="#b45309" text-anchor="middle" font-weight="normal">i = 2</text><circle cx="1010" cy="230" r="8" fill="#b45309" stroke="white" stroke-width="2"/><text x="1010" y="267" font-size="19" fill="#b45309" text-anchor="middle" font-weight="normal">i = 1</text><line x1="600" y1="280" x2="630" y2="343" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="280" x2="650" y2="343" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="188" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="normal">same endpoint value</text><line x1="270" y1="360" x2="1010" y2="360" stroke="#64748b" stroke-width="3"/><circle cx="270" cy="360" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="270" y="397" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="normal">J = 3</text><circle cx="455" cy="360" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="455" y="397" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="normal">J = 0</text><circle cx="640" cy="360" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="640" y="397" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="normal">J = 4</text><circle cx="825" cy="360" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="825" y="397" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="normal">J = 1</text><circle cx="1010" cy="360" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="1010" y="397" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="normal">J = 2</text><rect x="245" y="427" width="380" height="48" rx="10" fill="#faf5ff" stroke="#cbd5e1"/><rect x="660" y="427" width="380" height="48" rx="10" fill="#faf5ff" stroke="#cbd5e1"/><text x="435" y="457" font-size="21" fill="#7c3aed" text-anchor="middle" font-weight="normal">g_A = (3, 4, 0)</text><text x="850" y="457" font-size="21" fill="#7c3aed" text-anchor="middle" font-weight="normal">g_B = (4, 2, 1)</text></g></svg>