<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" role="img" aria-labelledby="title desc"><title id="title">Cell contributions accumulate in global entries</title><desc id="desc">Two P1 triangles on a unit square, global maps (0,1,2) and (1,3,2), and a four by four stiffness matrix. At global node 1, diagonal and load contributions add. Purple entries are shared by both cells, including numerical zeros.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1180" height="590" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="25" fill="#172b4d" text-anchor="start" font-weight="bold">One shared coefficient receives contributions from both cells</text><polygon points="90,365 350,365 90,105" fill="#e0f2fe"/><polygon points="350,365 350,105 90,105" fill="#ffedd5"/><line x1="90" y1="365" x2="350" y2="365" stroke="#64748b" stroke-width="3"/><line x1="350" y1="365" x2="350" y2="105" stroke="#64748b" stroke-width="3"/><line x1="350" y1="105" x2="90" y2="105" stroke="#64748b" stroke-width="3"/><line x1="90" y1="105" x2="90" y2="365" stroke="#64748b" stroke-width="3"/><line x1="350" y1="365" x2="90" y2="105" stroke="#64748b" stroke-width="3"/><circle cx="90" cy="365" r="10" fill="#172b4d" stroke="white" stroke-width="2"/><text x="90" y="397" font-size="21" fill="#172b4d" text-anchor="middle" font-weight="normal">a: 0</text><circle cx="350" cy="365" r="10" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="350" y="397" font-size="21" fill="#172b4d" text-anchor="middle" font-weight="normal">b: 1</text><circle cx="90" cy="105" r="10" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="90" y="86" font-size="21" fill="#172b4d" text-anchor="middle" font-weight="normal">c: 2</text><circle cx="350" cy="105" r="10" fill="#172b4d" stroke="white" stroke-width="2"/><text x="350" y="86" font-size="21" fill="#172b4d" text-anchor="middle" font-weight="normal">d: 3</text><text x="162" y="305" font-size="24" fill="#126782" text-anchor="middle" font-weight="normal">K1</text><text x="280" y="187" font-size="24" fill="#b45309" text-anchor="middle" font-weight="normal">K2</text><text x="50" y="448" font-size="21" fill="#126782" text-anchor="start" font-weight="normal">K1: g = (0, 1, 2)</text><text x="50" y="483" font-size="21" fill="#b45309" text-anchor="start" font-weight="normal">K2: g = (1, 3, 2)</text><text x="550" y="90" font-size="23" fill="#172b4d" text-anchor="start" font-weight="bold">Global stiffness matrix A</text><text x="585" y="126" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">0</text><text x="667" y="126" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">1</text><text x="749" y="126" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">2</text><text x="831" y="126" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">3</text><text x="522" y="173" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">0</text><rect x="548" y="141" width="74" height="58" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="585" y="177" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">1</text><rect x="630" y="141" width="74" height="58" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="667" y="177" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><rect x="712" y="141" width="74" height="58" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="749" y="177" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><rect x="794" y="141" width="74" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="831" y="177" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">0</text><text x="522" y="239" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">1</text><rect x="548" y="207" width="74" height="58" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="585" y="243" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><rect x="630" y="207" width="74" height="58" rx="10" fill="#f3e8ff" stroke="#cbd5e1"/><text x="667" y="243" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">1</text><rect x="712" y="207" width="74" height="58" rx="10" fill="#f3e8ff" stroke="#cbd5e1"/><text x="749" y="243" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">0</text><rect x="794" y="207" width="74" height="58" rx="10" fill="#ffedd5" stroke="#cbd5e1"/><text x="831" y="243" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><text x="522" y="305" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">2</text><rect x="548" y="273" width="74" height="58" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="585" y="309" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><rect x="630" y="273" width="74" height="58" rx="10" fill="#f3e8ff" stroke="#cbd5e1"/><text x="667" y="309" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">0</text><rect x="712" y="273" width="74" height="58" rx="10" fill="#f3e8ff" stroke="#cbd5e1"/><text x="749" y="309" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">1</text><rect x="794" y="273" width="74" height="58" rx="10" fill="#ffedd5" stroke="#cbd5e1"/><text x="831" y="309" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><text x="522" y="371" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal">3</text><rect x="548" y="339" width="74" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="585" y="375" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">0</text><rect x="630" y="339" width="74" height="58" rx="10" fill="#ffedd5" stroke="#cbd5e1"/><text x="667" y="375" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><rect x="712" y="339" width="74" height="58" rx="10" fill="#ffedd5" stroke="#cbd5e1"/><text x="749" y="375" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">-1/2</text><rect x="794" y="339" width="74" height="58" rx="10" fill="#ffedd5" stroke="#cbd5e1"/><text x="831" y="375" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">1</text><rect x="917" y="143" width="235" height="163" rx="10" fill="#faf5ff" stroke="#cbd5e1"/><text x="934" y="177" font-size="20" fill="#7c3aed" text-anchor="start" font-weight="bold">At node b (J = 1)</text><text x="934" y="224" font-size="18" fill="#172b4d" text-anchor="start" font-weight="normal">A11 = 1/2 + 1/2 = 1</text><text x="934" y="269" font-size="18" fill="#172b4d" text-anchor="start" font-weight="normal">b1 = 1/6 + 1/6 = 1/3</text><rect x="550" y="426" width="25" height="25" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="585" y="446" font-size="19" fill="#172b4d" text-anchor="start" font-weight="normal">K1</text><rect x="680" y="426" width="25" height="25" rx="10" fill="#ffedd5" stroke="#cbd5e1"/><text x="715" y="446" font-size="19" fill="#172b4d" text-anchor="start" font-weight="normal">K2</text><rect x="805" y="426" width="25" height="25" rx="10" fill="#f3e8ff" stroke="#cbd5e1"/><text x="840" y="446" font-size="19" fill="#172b4d" text-anchor="start" font-weight="normal">both</text><text x="550" y="491" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">A12 = 0: allocated, gradients orthogonal</text><text x="550" y="527" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">A03 = 0: no common cell</text><text x="28" y="568" font-size="19" fill="#172b4d" text-anchor="start" font-weight="normal">Before Dirichlet conditions: symmetric matrix, zero row sums, sum of load entries = area = 1.</text></g></svg>