<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">From reference data to global equations</title><desc id="desc">Reference finite element functions and quadrature are transformed by a mapping to physical values, gradients and JxW. Local quadrature sums produce cell matrices and loads. The DoF map accumulates these into the global arrays.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1120" height="590" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="25" fill="#172b4d" text-anchor="start" font-weight="bold">Separate geometry, integration and global indexing</text><rect x="30" y="75" width="330" height="125" rx="10" fill="#edf6fa" stroke="#cbd5e1"/><text x="50" y="107" font-size="22" fill="#126782" text-anchor="start" font-weight="bold">FiniteElement</text><text x="50" y="144" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">Reference values</text><text x="50" y="174" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">Reference gradients</text><rect x="395" y="75" width="330" height="125" rx="10" fill="#edf6fa" stroke="#cbd5e1"/><text x="415" y="107" font-size="22" fill="#126782" text-anchor="start" font-weight="bold">Quadrature</text><text x="415" y="144" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">Reference points</text><text x="415" y="174" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">Reference weights</text><rect x="760" y="75" width="330" height="125" rx="10" fill="#edf6fa" stroke="#cbd5e1"/><text x="780" y="107" font-size="22" fill="#126782" text-anchor="start" font-weight="bold">Mapping</text><text x="780" y="144" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">Physical points</text><text x="780" y="174" font-size="20" fill="#172b4d" text-anchor="start" font-weight="normal">Jacobian J</text><line x1="195" y1="201" x2="195" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="201" x2="560" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="925" y1="201" x2="925" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="245" width="820" height="95" rx="10" fill="#f0fdfa" stroke="#cbd5e1"/><text x="560" y="278" font-size="23" fill="#126782" text-anchor="middle" font-weight="bold">FEValues on cell K: reinit(cell)</text><text x="560" y="315" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="normal">Physical values     |     Physical gradients J^(-T) grad     |     JxW</text><line x1="560" y1="342" x2="560" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="388" width="510" height="81" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><text x="405" y="421" font-size="22" fill="#b45309" text-anchor="middle" font-weight="bold">Quadrature sums over q</text><text x="405" y="451" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="normal">Local matrix A_K and local load b_K</text><rect x="730" y="388" width="340" height="81" rx="10" fill="#faf5ff" stroke="#cbd5e1"/><text x="900" y="420" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="bold">DoFHandler</text><text x="900" y="451" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="normal">get_dof_indices: g_K</text><line x1="405" y1="472" x2="405" y2="506" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="900" y1="472" x2="900" y2="506" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="519" width="920" height="47" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="610" y="550" font-size="20" fill="#172b4d" text-anchor="middle" font-weight="normal">Accumulate: A[g_K(i), g_K(j)] += A_K[i,j]     and     b[g_K(i)] += b_K[i]</text></g></svg>