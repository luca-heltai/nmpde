<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">A fixed reference basis on every physical cell</title><desc id="desc">The reference triangle maps to a physical triangle under F_K. Reference quadrature points are mapped with F_K. Shape values agree at corresponding points; physical gradients use the inverse-transpose Jacobian and integration weights use its determinant.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1120" height="460" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="36" font-size="25" fill="#172b4d" text-anchor="start" font-weight="bold">Write the integral on K; compute it on the reference cell</text><polygon points="90,300 340,300 90,100" fill="#e0f2fe" stroke="#126782" stroke-width="3"/><polygon points="710,300 1040,300 780,100" fill="#ffedd5" stroke="#b45309" stroke-width="3"/><text x="220" y="85" font-size="22" fill="#126782" text-anchor="middle" font-weight="bold">Reference cell K̂</text><text x="920" y="85" font-size="22" fill="#b45309" text-anchor="middle" font-weight="bold">Physical cell K</text><line x1="385" y1="195" x2="665" y2="195" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="175" font-size="22" fill="#172b4d" text-anchor="middle" font-weight="normal">F_K: x = F_K(x̂)</text><circle cx="155" cy="247" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><circle cx="825" cy="247" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/><text x="155" y="278" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="normal">x̂_q</text><text x="825" y="278" font-size="20" fill="#7c3aed" text-anchor="middle" font-weight="normal">x_q</text><line x1="180" y1="247" x2="795" y2="247" stroke="#7c3aed" stroke-width="1" marker-end="url(#arrow)"/><text x="525" y="281" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="normal">same shape-function value</text><rect x="45" y="328" width="1030" height="52" rx="10" fill="#faf5ff" stroke="#cbd5e1"/><text x="560" y="361" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="bold">φ_K,i(F_K(x̂_q)) = φ̂_i(x̂_q)</text><text x="560" y="413" font-size="21" fill="#172b4d" text-anchor="middle" font-weight="normal">Tabulate φ̂_i and reference gradients once; transform gradients and weights for each cell.</text></g></svg>