<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" role="img" aria-labelledby="title desc">
  <title id="title">Quadrature on matching faces and on a coarse–fine interface</title>
  <desc id="desc">Before refinement the interface at x equals 1 is one whole face on each side and has two Gauss points. After refining the right square, subface 0 of the left face matches the lower right cell, and subface 1 matches the upper right cell. The two points on each segment are evaluated from both adjacent cells.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path fill="#15293d" d="M0 0l8 4L0 8z"/>
    </marker>
  </defs>
  <rect width="880" height="476" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#15293d" text-anchor="middle">
    <text x="440" y="39" font-size="24" font-weight="700">Both traces use the same physical quadrature points</text>

    <text x="234" y="83" font-size="21" font-weight="700">Conforming interface</text>
    <text x="646" y="83" font-size="21" font-weight="700">Coarse–fine interface</text>
    <rect x="60" y="118" width="174" height="174" fill="#e9f2f8"/>
    <rect x="234" y="118" width="174" height="174" fill="#fcf2e5"/>
    <rect x="472" y="118" width="174" height="174" fill="#e9f2f8"/>
    <rect x="646" y="118" width="174" height="174" fill="#fcf2e5"/>
    <g stroke="#64778a" stroke-width="2" fill="none">
      <rect x="60" y="118" width="348" height="174"/>
      <rect x="472" y="118" width="348" height="174"/>
      <path d="M733 118v174M646 205h174"/>
    </g>
    <path d="M234 118v174M646 208v84" fill="none" stroke="#185b87" stroke-width="6"/>
    <path d="M646 118v84" fill="none" stroke="#974600" stroke-width="6" stroke-dasharray="9 5"/>
    <g stroke="#15293d" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M229 325h30"/>
      <path d="M229 325v-22"/>
      <path d="M641 325h30"/>
      <path d="M641 325v-22"/>
    </g>
    <g fill="#15293d" font-size="14">
      <text x="271" y="330">x</text>
      <text x="684" y="330">x</text>
      <text x="216" y="311">y</text>
      <text x="628" y="311">y</text>
      <text x="234" y="109">x = 1</text>
      <text x="646" y="109">x = 1</text>
    </g>
    <g fill="#15293d" stroke="#fff" stroke-width="2">
      <circle cx="234" cy="154.77" r="5"/>
      <circle cx="234" cy="255.23" r="5"/>
      <circle cx="646" cy="136.38" r="5"/>
      <circle cx="646" cy="186.62" r="5"/>
      <circle cx="646" cy="223.38" r="5"/>
      <circle cx="646" cy="273.62" r="5"/>
    </g>
    <circle cx="646" cy="205" r="5" fill="#fff" stroke="#15293d" stroke-width="2"/>
    <path d="M629 205h-23" fill="none" stroke="#64778a" stroke-width="1.5"/>
    <g font-size="16">
      <text x="147" y="153" font-weight="700">Left cell</text>
      <text x="147" y="179">Whole face 1</text>
      <text x="321" y="153" font-weight="700">Right cell</text>
      <text x="321" y="179">Whole face 0</text>

      <text x="551" y="151" fill="#974600" font-weight="700">Subface 1</text>
      <text x="551" y="173">Upper half</text>
      <text x="498" y="210" text-anchor="start">Hanging node</text>
      <text x="551" y="244" fill="#185b87" font-weight="700">Subface 0</text>
      <text x="551" y="266">Lower half</text>
      <text x="689" y="150" font-weight="700">Upper cell</text>
      <text x="689" y="172" font-size="14">Whole face 0</text>
      <text x="689" y="242" font-weight="700">Lower cell</text>
      <text x="689" y="264" font-size="14">Whole face 0</text>
    </g>
    <g font-size="17">
      <text x="234" y="365">Whole face 1 ↔ whole face 0</text>
      <text x="646" y="357">Left face 1 is split into two subfaces.</text>
      <text x="646" y="383">Each subface matches one whole right face.</text>
    </g>
    <rect x="58" y="411" width="764" height="47" rx="8" fill="#f4f7fa"/>
    <circle cx="89" cy="434.5" r="5" fill="#15293d" stroke="#fff" stroke-width="2"/>
    <text x="106" y="440" text-anchor="start" font-size="16">Gauss point</text>
    <circle cx="298" cy="434.5" r="5" fill="#fff" stroke="#15293d" stroke-width="2"/>
    <text x="315" y="440" text-anchor="start" font-size="16">Hanging node</text>
    <text x="521" y="440" text-anchor="start" font-size="16">Face numbers are local to each cell.</text>
  </g>
</svg>
