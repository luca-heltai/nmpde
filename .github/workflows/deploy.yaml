# This job installs dependencies, builds the book, and pushes it to `gh-pages`.
name: deploy-book

on:
  # Deploy the public book only from the current main branch.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-book
  cancel-in-progress: true

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Create the local build environment
      run: |
        ./start.sh

    - name: Build the book
      run: |
        make build

    - name: Publish the book to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./notes/_build/html/
