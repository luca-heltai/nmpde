name: Build, test, and deploy

on:
  push:
    branches: [main]

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dealii-tests:
    name: deal.II tests
    uses: ./.github/workflows/dealii-tests.yaml
    with:
      upload-figures: true

  build-book:
    name: Build Jupyter Book 2
    needs: dealii-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download generated figures
        uses: actions/download-artifact@v4
        with:
          name: generated-course-figures
          path: notes/assets/generated/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install book dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build and check the book
        working-directory: notes
        run: jupyter-book build --html --strict --ci --check-links

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: notes/_build/html

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
