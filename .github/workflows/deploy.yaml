name: Build, test, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lab-tests:
    name: Build laboratories and run GTest
    runs-on: ubuntu-latest
    container:
      image: dealii/dealii:v9.7.1-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DNMPDE_BUILD_LABS=ON -DNMPDE_BUILD_TESTS=ON

      - name: Build laboratories and tests
        run: cmake --build build --parallel 2

      - name: Run tests and generate course figures
        run: ctest --test-dir build --output-on-failure

      - name: Verify generated figures
        run: |
          test -s notes/assets/generated/lecture-01-poisson-mesh.svg
          test -s notes/assets/generated/lab-01-refined-mesh.svg

      - name: Upload generated figures
        uses: actions/upload-artifact@v4
        with:
          name: generated-course-figures
          path: notes/assets/generated/
          if-no-files-found: error

  build-book:
    name: Build Jupyter Book 2
    needs: lab-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download generated figures
        uses: actions/download-artifact@v4
        with:
          name: generated-course-figures
          path: notes/assets/generated/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install book dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build and check the book
        working-directory: notes
        run: jupyter-book build --html --strict --ci --check-links

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: notes/_build/html

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
